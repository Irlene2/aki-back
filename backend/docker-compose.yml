services:
  postgres:
    image: postgres:16-alpine
    container_name: aki-delivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aki_delivery
      POSTGRES_USER: aki
      POSTGRES_PASSWORD: aki_dev_password
    ports:
      - "5432:5432"
    volumes:
      - aki_delivery_postgres_data:/var/lib/postgresql/data

volumes:
  aki_delivery_postgres_data:
